<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Diagnostic review · __RUN_ID__</title>
<style>
:root { --bg:#f6f5f2; --inset:#eceae5; --fg:#1f1d1a; --muted:#6e6a63; --rule:#d8d4cc; --accent:#8a4b1f; --warn:#8a6d1f; --danger:#8a2f2f; --fixed:#3a6ea5; --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace; --sans:system-ui,sans-serif; }
* { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); }
button,input { font:inherit; } :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.topbar { padding:24px clamp(20px,4vw,56px); border-bottom:1px solid var(--rule); } .topbar h1 { margin:0 0 6px; font:600 clamp(26px,4vw,46px)/1.05 var(--sans); letter-spacing:-.035em; }
.topbar-meta { margin:0; color:var(--muted); font:12px/1.6 var(--mono); } .layout { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:calc(100vh - 106px); }
.rail { position:sticky; top:0; align-self:start; height:100vh; overflow:auto; padding:20px; border-right:1px solid var(--rule); background:var(--inset); } .rail h2 { margin:24px 0 8px; font:600 11px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.08em; }
.search { width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:3px; background:var(--bg); color:var(--fg); } .filters label,.project-links a { display:flex; justify-content:space-between; gap:8px; padding:5px 0; color:var(--fg); font-size:13px; text-decoration:none; } .project-links a:hover { color:var(--accent); }
.notice { padding:9px; border-left:3px solid var(--warn); color:var(--muted); font-size:12px; } .content { min-width:0; padding:8px clamp(20px,4vw,64px) 80px; }
.project { max-width:1180px; margin:0 auto; padding-top:44px; } .project-header { display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--fg); } .project-header h2 { margin:0 0 8px; font-size:22px; } .project-header span,.target-group h3 span { color:var(--muted); font:11px var(--mono); }
.target-group { margin-top:28px; } .target-group h3 { display:flex; justify-content:space-between; margin:0; padding:0 0 7px; border-bottom:1px solid var(--rule); font:600 12px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.06em; }
.finding { border-bottom:1px solid var(--rule); } .finding-row { display:flex; align-items:baseline; gap:8px; padding:12px 8px; cursor:pointer; list-style:none; } .finding-row::-webkit-details-marker { display:none; } .finding-row::before { content:"+"; color:var(--muted); font:14px var(--mono); } .finding[open]>.finding-row::before { content:"−"; } .finding[open]>.finding-row { background:var(--inset); }
.finding-title { flex:1; font-weight:560; } .badge { flex:none; padding:1px 6px; border:1px solid currentColor; border-radius:3px; font:10px/1.45 var(--mono); text-transform:uppercase; } .badge-prev-yes { color:var(--danger); } .badge-prev-partial { color:var(--warn); } .badge-prev-no,.badge-confidence { color:var(--muted); } .badge-fixed { color:var(--fixed); }
.finding.is-fixed { border-left:3px solid var(--fixed); } .finding.is-fixed .finding-title { color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px; } .finding-detail { padding:20px clamp(8px,3vw,34px) 32px; }
.metadata { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:0 0 16px; } .metadata div { min-width:0; } .metadata dt { margin-bottom:4px; color:var(--muted); font:10px var(--mono); text-transform:uppercase; letter-spacing:.06em; } .metadata dd { margin:0; overflow-wrap:anywhere; font-size:12px; } code { font-family:var(--mono); } .case-id { display:inline-block; margin:0 4px 4px 0; }
.finding-actions { display:flex; align-items:center; gap:8px; margin-bottom:16px; } .button { padding:6px 10px; border:1px solid var(--rule); border-radius:3px; background:var(--bg); color:var(--fg); cursor:pointer; } .button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); } .button-primary { border-color:var(--accent); color:var(--accent); } .button:disabled { cursor:not-allowed; opacity:.55; } .action-status { color:var(--muted); font-size:12px; }
.finding-body { max-width:100%; margin:0; padding:18px; overflow:auto; white-space:pre-wrap; background:var(--inset); border:1px solid var(--rule); font:12.5px/1.6 var(--mono); } .is-hidden,.target-group.is-empty,.project.is-empty { display:none; }
@media (max-width:800px) { .layout { display:block; } .rail { position:relative; width:auto; height:auto; border-right:0; border-bottom:1px solid var(--rule); } .metadata { grid-template-columns:1fr; } .finding-row { flex-wrap:wrap; } .finding-title { flex-basis:70%; } }
@media (prefers-color-scheme:dark) { :root { --bg:#1c1a17; --inset:#24211d; --fg:#e8e5df; --muted:#aaa49a; --rule:#3a3630; --accent:#d18a52; --warn:#c2a553; --danger:#d17474; --fixed:#72a5d8; } }
@media print { .rail,.finding-actions { display:none; } .layout { display:block; } .finding:not([open]) .finding-detail { display:block; } .finding-body { white-space:pre-wrap; } }
</style>
</head>
<body>
<header class="topbar"><h1>Agent session diagnostics</h1><p class="topbar-meta">Run __RUN_ID__ · <span id="visible-count">__FINDING_COUNT__</span> visible · <span id="fixed-count">__FIXED_COUNT__</span> fixed · __PROJECT_COUNT__ projects</p></header>
<div class="layout">
<aside class="rail" aria-label="Review controls">
  <input id="search" class="search" type="search" aria-label="Search findings" placeholder="Search findings">
  __STATIC_NOTICE__
  <h2>Remedy target</h2><div class="filters">__TARGET_FILTERS__</div>
  <h2>Status</h2><label><input id="show-fixed" type="checkbox" checked> Show fixed</label>
  <h2>Projects</h2><nav class="project-links">__PROJECT_LINKS__</nav>
</aside>
<main class="content">__PROJECT_SECTIONS__</main>
</div>
<script>
const csrfToken = __CSRF_TOKEN__;
const findings = [...document.querySelectorAll('.finding')];
const search = document.querySelector('#search');
const showFixed = document.querySelector('#show-fixed');
const targetInputs = [...document.querySelectorAll('input[name="target"]')];
function applyFilters() {
  const query = search.value.trim().toLowerCase();
  const targets = new Set(targetInputs.filter(input => input.checked).map(input => input.value));
  let visible = 0;
  for (const finding of findings) {
    const matches = targets.has(finding.dataset.target) && (showFixed.checked || finding.dataset.status !== 'fixed') && (!query || finding.textContent.toLowerCase().includes(query));
    finding.classList.toggle('is-hidden', !matches); if (matches) visible++;
  }
  for (const group of document.querySelectorAll('.target-group')) group.classList.toggle('is-empty', !group.querySelector('.finding:not(.is-hidden)'));
  for (const project of document.querySelectorAll('.project')) project.classList.toggle('is-empty', !project.querySelector('.finding:not(.is-hidden)'));
  document.querySelector('#visible-count').textContent = visible;
}
search.addEventListener('input', applyFilters); showFixed.addEventListener('change', applyFilters); targetInputs.forEach(input => input.addEventListener('change', applyFilters));
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const area = document.createElement('textarea'); area.value = text; area.style.position = 'fixed'; area.style.opacity = '0'; document.body.append(area); area.select(); document.execCommand('copy'); area.remove();
}
document.addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]'); if (!button) return;
  const finding = button.closest('.finding'); const status = finding.querySelector('.action-status');
  if (button.dataset.action === 'copy') {
    try { await copyText(button.dataset.prompt); status.textContent = 'Prompt copied.'; } catch (error) { status.textContent = `Copy failed: ${error.message}`; } return;
  }
  button.disabled = true; status.textContent = 'Saving…';
  try {
    const response = await fetch(`/api/findings/${finding.dataset.id}/fixed`, {method:'POST', headers:{'X-Review-Token':csrfToken}});
    const payload = await response.json(); if (!response.ok) throw new Error(payload.error || response.statusText);
    finding.dataset.status = 'fixed'; finding.classList.add('is-fixed'); finding.querySelector('.finding-title').insertAdjacentHTML('afterend','<span class="badge badge-fixed">fixed</span>'); button.textContent = 'Fixed'; status.textContent = payload.fixed_cases.length ? `Saved. Evidence fixed: ${payload.fixed_cases.join(', ')}` : 'Saved. Shared evidence still has open findings.';
    document.querySelector('#fixed-count').textContent = findings.filter(item => item.dataset.status === 'fixed').length; applyFilters();
  } catch (error) { button.disabled = false; status.textContent = `Save failed: ${error.message}`; }
});
</script>
</body>
</html>
